version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-ocpp}
      POSTGRES_USER: ${DB_USER:-ocpp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ocpp}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  web:
    build: .
    command: bash -c "python manage.py migrate && uvicorn ocpp_backend.asgi:application --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocpp}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      - db
    expose:
      - "8000"
    volumes:
      - .:/app

  ocpp:
    build: .
    command: bash -c "python -m ocpp_server.server"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-ocpp}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      - db
    expose:
      - "9000"
    volumes:
      - .:/app

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - web
      - ocpp
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  dbdata:
