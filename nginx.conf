user  nginx;
worker_processes  auto;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream django_upstream {
    server web:8000;
  }

  upstream ocpp_upstream {
    server ocpp:9000;
  }

  upstream ocpp_http_upstream {
    server ocpp:9100;
  }

  server {
    listen 80;
    server_name _;

    # Django app (HTTP)
    location / {
      proxy_pass http://django_upstream;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OCPP WebSocket (ws://host/ocpp/<CHARGE_POINT_ID>)
    location ^~ /ocpp/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      # Trailing slash strips the /ocpp/ prefix when forwarding
      proxy_pass http://ocpp_upstream/;
    }

    # OCPP Control API (HTTP) proxied to ocpp container
    location ^~ /ocpp-api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://ocpp_http_upstream/;
    }
  }
}
