version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME:-ocpp}
      POSTGRES_USER: ${DB_USER:-ocpp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ocpp}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  web:
    build: .
    command: bash -c "python manage.py migrate && uvicorn ocpp_backend.asgi:application --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  ocpp:
    build: .
    command: bash -c "python ocpp_server/server.py"
    env_file: .env
    depends_on:
      - db
      - web
    ports:
      - "9000:9000"
    volumes:
      - .:/app

volumes:
  dbdata: